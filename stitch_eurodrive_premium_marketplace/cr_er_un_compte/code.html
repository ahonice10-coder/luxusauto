<style>
          /* Glassmorphism utilities */
          .glass-panel {
              background: rgba(38, 38, 38, 0.5); /* #262626 at 50% opacity */
              backdrop-filter: blur(12px);
              -webkit-backdrop-filter: blur(12px);
              border: 1px solid rgba(255, 255, 255, 0.1);
          }
          
          /* Form Input Styles */
          .veloce-input {
              @apply w-full bg-[#121212] border border-outline-variant rounded-lg px-4 py-3 text-on-surface font-body-md focus:outline-none focus:border-inverse-primary focus:ring-1 focus:ring-inverse-primary transition-colors duration-200;
          }
          .veloce-label {
              @apply block mb-2 text-secondary font-label-caps text-label-caps uppercase tracking-wider;
          }
          
          /* Primary Button */
          .veloce-btn-primary {
              @apply w-full bg-primary-container text-white font-headline-md text-body-lg py-3 rounded-lg hover:brightness-110 active:scale-[0.98] transition-all duration-200 relative overflow-hidden;
          }
          .veloce-btn-primary::after {
              content: '';
              position: absolute;
              top: 0; left: 0; right: 0; bottom: 0;
              box-shadow: inset 0 0 20px rgba(255,255,255,0.2);
              opacity: 0;
              transition: opacity 0.2s;
              pointer-events: none;
          }
          .veloce-btn-primary:hover::after {
              opacity: 1;
          }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-white">
<!-- Background Pattern/Image -->
<div class="fixed inset-0 z-0 opacity-20 mix-blend-screen pointer-events-none" data-alt="Abstract modern automotive background in dark mode. Extremely dark sleek setting with subtle glowing blue architectural lines reflecting on polished black metallic surfaces. Cinematic lighting, high-end European showroom atmosphere at night, deep shadows, premium engineering aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCxoC1bePrL1rY3IF7tqoUQlvpb9ifbhPstymvSX5nNU5hb4LwuTeI6vEnI65AotZ89AoeZ3xlQgRhSNEKcAdHIjKgIjiH7fv3hsve2ESNY--r2tI6htGcZgvqBC6Nxzlu7SzfSXrLkg0Y-_j8-hrKGHvbXHiXhcpnXUu9Bp40p2s7Xu-7Pd94Uq7oK7yQ_J6S0IXOtWRXv6BGI7Gi77RMucKnBSHtbk-WLEZH-uYOtCpGuAEXmlDC3Ig')">
</div>
<!-- Linear Gradient Overlay to fade bottom -->
<div class="fixed inset-0 z-0 bg-gradient-to-b from-background/30 via-background/80 to-background pointer-events-none"></div>
<main class="flex-grow flex items-center justify-center relative z-10 px-margin-mobile py-stack-lg md:px-margin-desktop min-h-screen">
<div class="w-full max-w-[480px]">
<!-- Brand Header -->
<div class="text-center mb-stack-md">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter uppercase mb-2">VELOCE</h1>
<p class="font-label-caps text-label-caps text-secondary uppercase tracking-[0.2em]">Engineered for Excellence</p>
</div>
<!-- Signup Form Card -->
<div class="glass-panel rounded-xl p-8 md:p-10 shadow-[0_20px_40px_rgba(0,82,255,0.05)]">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your details to join the exclusive marketplace.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Nom -->
<div>
<label class="veloce-label" for="name">Nom Complet</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">person</span>
</span>
<input class="veloce-input pl-10" id="name" name="name" placeholder="Alexander Rossi" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="veloce-label" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">mail</span>
</span>
<input class="veloce-input pl-10" id="email" name="email" placeholder="alexander@veloce.com" required="" type="email"/>
</div>
</div>
<!-- Phone -->
<div>
<label class="veloce-label" for="phone">Téléphone</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">call</span>
</span>
<input class="veloce-input pl-10" id="phone" name="phone" placeholder="+33 6 12 34 56 78" required="" type="tel"/>
</div>
</div>
<!-- Password -->
<div>
<label class="veloce-label" for="password">Mot de passe</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">lock</span>
</span>
<input class="veloce-input pl-10 pr-10" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-secondary hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<!-- Terms -->
<div class="flex items-start mt-4">
<div class="flex items-center h-5">
<input class="w-4 h-4 bg-[#121212] border-outline-variant rounded text-primary-container focus:ring-primary-container focus:ring-offset-background" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant text-sm" for="terms">
                            J'accepte les <a class="text-primary hover:underline" href="#">Conditions d'utilisation</a> et la <a class="text-primary hover:underline" href="#">Politique de confidentialité</a>.
                          </label>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="veloce-btn-primary flex items-center justify-center gap-2" type="submit">
<span>S'inscrire</span>
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</form>
<!-- Login Link -->
<div class="mt-8 text-center border-t border-outline-variant/30 pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Vous avez déjà un compte ? 
                        <a class="text-primary hover:text-primary-fixed transition-colors font-bold ml-1 hover:underline underline-offset-4 decoration-2" href="#">Connexion</a>
</p>
</div>
</div>
</div>
</main>
</body></html>
